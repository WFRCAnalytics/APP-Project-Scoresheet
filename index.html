<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Project Evaluation Scoresheet</title>
    <!-- Favicon uses the abbreviated (WFRC mark) logo, matching the browser's own
         prefers-color-scheme rather than the in-app theme toggle — the tab chrome is
         outside React's control, so this can only track the OS/browser preference. -->
    <link
      rel="icon"
      type="image/png"
      href="/src/assets/logo/abbreviated/WFRC_logo_abbreviated_color_transparent.png"
      media="(prefers-color-scheme: light)"
    />
    <link
      rel="icon"
      type="image/png"
      href="/src/assets/logo/abbreviated/WFRC_logo_abbreviated_white_transparent.png"
      media="(prefers-color-scheme: dark)"
    />
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
